name: build
on:
  push: {branches: [main, master], tags: ['v*']}
  pull_request:
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{{{ matrix.os }}}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        run: npm install --no-audit --no-fund || true
      - name: Bundle source
        run: |
          tar --exclude=.git -czf "${{{{ github.event.repository.name }}}}-${{{{ runner.os }}}}.tar.gz" .
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{{{ github.event.repository.name }}}}-${{{{ runner.os }}}}
          path: "*.tar.gz"
