<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover so the player can paint under the iPhone status bar -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Lumen</title>

  <!-- ============ iOS "Add to Home Screen" / standalone ============ -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Lumen">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="description" content="Lumen — watch YouTube on a 144p diet, rebuilt in HD by a neural upscaler.">
  <link rel="apple-touch-icon" href="/icons/icon-180.png">
  <link rel="icon" type="image/png" href="/icons/icon-32.png" sizes="32x32">
  <link rel="icon" type="image/png" href="/icons/icon-192.png" sizes="192x192">
  <link rel="manifest" href="/manifest.json">

  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div id="app">
    <!-- top bar: YouTube logo + actions -->
    <header id="topbar">
      <button id="logo" aria-label="Lumen home">
        <svg viewBox="0 0 40 28" width="30" height="21"><rect width="40" height="28" rx="7" fill="#ff0033"/><path d="M16 9l10.5 5L16 19z" fill="#fff"/></svg>
        <span>Lumen</span>
      </button>
      <div id="topacts">
        <a href="#/search" class="ico" aria-label="Search" id="topsearch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
        </a>
        <button class="ico" aria-label="More" id="topdots">
          <svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4zm0 6a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>
        </button>
      </div>
    </header>

    <main id="view"><!-- SPA views render here --></main>
  </div>

  <!-- ============ YouTube-style bottom tab bar ============ -->
  <nav id="bottomnav">
    <button class="navbtn" data-nav="home" aria-label="Home">
      <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      <span>Home</span>
    </button>
    <button class="navbtn" data-nav="shorts" aria-label="Shorts">
      <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="18" rx="3"/><path d="M10.8 9l4.4 3-4.4 3z"/></svg>
      <span>Shorts</span>
    </button>
    <button class="navbtn" data-nav="saved" aria-label="Watch later" id="navcreate">
      <svg viewBox="0 0 24 24"><path d="M13 3v8h8v2h-8v8h-2v-8H3v-2h8V3z"/></svg>
      <span>Saved</span>
    </button>
    <button class="navbtn" data-nav="subs" aria-label="Subscriptions">
      <svg viewBox="0 0 24 24"><path d="M4 6h16v1H4zM6 3h12v1H6zM4 10h16v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M10 13l5 3-5 3z"/></svg>
      <span>Subscriptions</span>
    </button>
    <button class="navbtn" data-nav="you" aria-label="You">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M12 14c-4.42 0-8 2.24-8 5v2h16v-2c0-2.76-3.58-5-8-5z"/></svg>
      <span>You</span>
    </button>
  </nav>

  <!-- ============ Watch view: media layer + semantic overlay ============ -->
  <div id="player" hidden>
    <div id="stage">
      <video id="v" playsinline muted autoplay></video>
      <audio id="a" playsinline preload="auto"></audio>
      <canvas id="sr"></canvas>

      <!-- crisp native typography/controls ABOVE the neural canvas -->
      <div id="topgrade">
        <button id="back" aria-label="Back">
          <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z"/></svg>
        </button>
        <div id="vititle"></div>
        <button id="close" aria-label="Close" style="display:none">✕</button>
      </div>

      <!-- Shorts right action rail (visible only in portrait mode) -->
      <div id="rail">
        <button id="rlike">
          <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zM23 10c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
          <span id="rlikec">0</span>
        </button>
        <button id="rdislike">
          <svg viewBox="0 0 24 24"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.58-6.59c.37-.36.59-.86.59-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg>
        </button>
        <button id="rcomment" onclick="location.hash='#watch-comments'">
          <svg viewBox="0 0 24 24"><path d="M12 3C6.5 3 2 6.58 2 11c0 2.5 1.3 4.72 3.4 6.2-.1.9-.5 2.4-1.4 3.8 0 0 2.6-.3 4.65-1.6.9.3 1.9.4 2.95.4 5.5 0 10-3.58 10-8s-4.5-8-10-8z"/></svg>
        </button>
        <button id="rshare">
          <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg>
        </button>
      </div>

      <div id="subtitle"><span></span></div>
      <div id="controls">
        <button id="play" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
        <span id="time">0:00 / 0:00</span>
        <span id="badge" title="144p transport, SR re-render">144p ⇢ SR×3</span>
        <label id="cclabel" style="display:none"><input type="checkbox" id="cc" checked> CC</label>
      </div>
      <div id="bootmsg" hidden>Loading neural engine…</div>
    </div>
    <div id="meta"></div>
  </div>

  <script src="/vendor/onnxruntime-web/ort.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
